# ============================================================================
#  Configuration centrale du projet « traducteur de chat »
# ----------------------------------------------------------------------------
#  Ce fichier est le MODÈLE versionné. Pour l'utiliser :
#      uv run --no-sync python -m core.initialiser --nom-chat Moka
#  Le script génère une clé et refuse d'écraser une configuration existante.
#  Aucun secret en dur dans le code : tout passe par ici.
# ============================================================================

projet:
  nom: "chat-traducteur"
  version: "0.1.0"

# Le nom est affiché dans l'app APRÈS connexion. Un dossier de projet = un chat.
chat:
  nom: "Mon chat"

# ----------------------------------------------------------------------------
#  LABELS — les contextes observés à classer pour son chat (pas les classes CatMeows).
#  Choisir ses catégories AVANT la collecte ; conserver autre et incertain.
#  Renommer une ligne ne migre pas les anciens clips : voir docs/personnalisation.md.
# ----------------------------------------------------------------------------
labels:
  - faim
  - porte
  - calin
  - autre          # vocalise identifiable mais hors catégories (trille, feulement…) → négatif/atypique à l'entraînement
  - incertain      # miaulement normal, contexte inconnu → QUARANTAINE, exclu de l'entraînement (voir labels_exclus)

# ----------------------------------------------------------------------------
#  CHEMINS — relatifs à la racine du projet (résolus en absolu par le code).
# ----------------------------------------------------------------------------
chemins:
  data_catmeows: "data/catmeows"   # dataset public (Phase 1)
  data_mon_chat: "data/mon_chat"   # mes enregistrements labellisés (Phase 2+)
  models: "models"                 # modèles entraînés
  logs: "logs"                     # journaux d'exécution

# ----------------------------------------------------------------------------
#  AUDIO — baseline CatMeows. PANNs personnel utilise ses propres réglages
#  fixes (32 kHz / 4 s) ; voir docs/apprentissage.md.
# ----------------------------------------------------------------------------
audio:
  sample_rate: 16000     # Hz — on ramène tout en 16 kHz mono
  mono: true
  duree_max_s: 4.0       # durée max d'un extrait (padding/troncature)
  trim_silence: true     # rogner les silences en début/fin
  trim_top_db: 30        # seuil du trim (dB sous le pic)
  # Spectrogramme mel
  n_fft: 1024
  hop_length: 256
  n_mels: 64
  fmin: 50               # les miaulements montent haut : on garde large
  fmax: 8000

# ----------------------------------------------------------------------------
#  AUGMENTATION — baseline CatMeows uniquement, pas le linear probe personnel.
# ----------------------------------------------------------------------------
augmentation:
  active: true
  proba: 0.5              # chaque augmentation ne s'applique qu'à 50 % (anti sous-apprentissage)
  time_shift: true
  pitch_shift: true       # léger
  pitch_shift_demi_tons: 1.0
  bruit_de_fond: true
  bruit_niveau: 0.005
  spec_augment: true

# ----------------------------------------------------------------------------
#  ENTRAÎNEMENT — réglages historiques CatMeows, sauf labels_exclus qui sert
#  à la collecte / Phase 3. Le personnel utilise des groupes par JOUR,
#  une seed fixe de 42 et une grille dans le code. device ci-dessous : baseline.
# ----------------------------------------------------------------------------
entrainement:
  device: "auto"
  seed: 42
  batch_size: 16         # adapté à un GPU ~6 Go — baisser si OOM
  epochs: 50
  learning_rate: 0.001
  early_stopping_patience: 8
  # Split PROPRE : par CHAT et pas par enregistrement (évite la fuite de données)
  split_par: "chat"
  val_ratio: 0.15
  test_ratio: 0.15
  # Labels mis en quarantaine : exclus de l'entraînement par défaut (Phase 3).
  # "incertain" = contexte inconnu, en attente de ré-étiquetage / calibration seuil.
  labels_exclus:
    - incertain

# ----------------------------------------------------------------------------
#  COLLECTE — serveur FastAPI + PWA (Phase 2).
# ----------------------------------------------------------------------------
collecte:
  host: "127.0.0.1"      # accès local ; ngrok peut relayer ce port sans écouter sur tout le réseau
  port: 8771             # changer si un autre service occupe ce port
  # Token simple exigé dans l'en-tête/URL pour ne pas être ouvert à internet
  # via ngrok. À CHANGER dans config.yaml (ne pas laisser cette valeur).
  token: "CHANGE-MOI-token-secret"
  pre_buffer_s: 5.0      # repère documentaire : frontend actuellement fixé à 5 s
  # Mémo facultatif ; aucun tunnel n'est démarré ou remplacé automatiquement.
  ngrok_domaine: ""

# ----------------------------------------------------------------------------
#  TEMPS RÉEL — écoute continue (Phase 4).
# ----------------------------------------------------------------------------
temps_reel:
  micro: null            # index du périphérique (null = défaut système)
  seuil_confiance: 0.6   # futur seuil expérimental, NON calibré, pas actif dans la collecte
  cooldown_s: 20         # regroupe les miaulements rapprochés en 1 événement

# ----------------------------------------------------------------------------
#  JOURNALISATION
# ----------------------------------------------------------------------------
journalisation:
  niveau: "INFO"         # DEBUG | INFO | WARNING | ERROR
  fichier: "chat-traducteur.log"
