[project]
name = "chat-traducteur"
version = "0.1.0"
description = "Projet éducatif : collecte privée et classification supervisée des vocalisations de son chat."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Dépendances de base (Phase 0) : juste de quoi lire la config et journaliser.
# Les grosses dépendances (ML, serveur) sont dans des groupes optionnels
# ci-dessous, pour ne pas télécharger des gigas avant d'en avoir besoin.
dependencies = [
    "pyyaml>=6.0",
]

# Facultatif : aucun PyTorch / modèle à télécharger pour commencer la collecte.
[project.optional-dependencies]
cpu = ["torch>=2.6"]
cu124 = ["torch>=2.6"]

[dependency-groups]
# Phases 1 & 3 — entraînement / évaluation.
#   uv sync --group training
# Ajouter --extra cpu (sans NVIDIA) ou --extra cu124 (CUDA compatible).
training = [
    # numba>=0.61 supporte Python 3.13 (les vieilles versions plantent au build).
    # numpy borné <2.2 pour rester compatible avec numba 0.61.
    "numpy>=2.0,<2.2",
    "numba>=0.61",
    "librosa>=0.11",
    "soundfile>=0.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

# Phase 2 — serveur de collecte (PWA + API).
#   uv sync --group collecte
collecte = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=2.0,<2.2",       # lecture WAV + détection de miaulement
]

# Phase 4 — écoute temps réel sur le PC.
#   uv sync --group temps-reel
temps-reel = [
    "sounddevice>=0.4",
    "numpy>=2.0",
]

# Tests sans modèle, sans GPU, sans téléchargement de dataset.
test = [
    { include-group = "collecte" },
    "scikit-learn>=1.5",
]

# Transfer learning — backbone PANNs CNN14 (frontend log-mel via torchlibrosa).
# Les poids AudioSet se téléchargent à part (voir docs/baseline.md, §Transfer).
# On n'utilise PAS le paquet panns-inference (wget/CSV externe fragile) : le
# modèle est vendorisé dans training/panns_cnn14.py.
#   uv sync --group collecte --group training --group transfer --extra cpu
transfer = [
    "torchlibrosa>=0.1.0",
]

[tool.uv]
# Projet « application », pas une bibliothèque à builder : on exécute
# le code depuis les sources (uv run python -m training.entrainement).
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]
# Utilise le magasin de certificats du système (interception TLS locale :
# antivirus / proxy). Évite d'avoir à passer --system-certs à chaque
# commande uv.
system-certs = true

# Index PyTorch CUDA 12.4 (roues GPU pour Windows / Python 3.13).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
line-length = 100
target-version = "py313"
