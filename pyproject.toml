[project]
name = "chat-traducteur"
version = "0.1.0"
description = "Classifieur d'intentions de miaulements — comprendre ce que raconte mon chat."
readme = "README.md"
requires-python = ">=3.13"
# Dépendances de base (Phase 0) : juste de quoi lire la config et journaliser.
# Les grosses dépendances (ML, serveur) sont dans des groupes optionnels
# ci-dessous, pour ne pas télécharger des gigas avant d'en avoir besoin.
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
# Phases 1 & 3 — entraînement / évaluation.
#   uv sync --group training
# Note : torch / torchaudio ne sont PAS listés ici car leur version dépend
# de CUDA (RTX 2070). On les installera à la main en Phase 1 (voir docs/).
training = [
    # numba>=0.61 supporte Python 3.13 (les vieilles versions plantent au build).
    # numpy borné <2.2 pour rester compatible avec numba 0.61.
    "numpy>=2.0,<2.2",
    "numba>=0.61",
    "librosa>=0.11",
    "soundfile>=0.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

# Phase 2 — serveur de collecte (PWA + API).
#   uv sync --group collecte
collecte = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=2.0,<2.2",       # lecture WAV + détection de miaulement
]

# Phase 4 — écoute temps réel sur le PC.
#   uv sync --group temps-reel
temps-reel = [
    "sounddevice>=0.4",
    "numpy>=2.0",
]

# PyTorch avec CUDA (GPU). Séparé car ~2.5 Go et lié à la version CUDA.
#   uv sync --group training --group gpu
# Version CPU (petite) si pas de GPU : retirer la source ci-dessous et
# installer torch/torchaudio depuis PyPI.
gpu = [
    "torch>=2.5",
    "torchaudio>=2.5",
]

# Transfer learning — backbone PANNs CNN14 (frontend log-mel via torchlibrosa).
# Les poids AudioSet se téléchargent à part (voir docs/baseline.md, §Transfer).
# On n'utilise PAS le paquet panns-inference (wget/CSV externe fragile) : le
# modèle est vendorisé dans training/panns_cnn14.py.
#   uv sync --group training --group gpu --group transfer
transfer = [
    "torchlibrosa>=0.1.0",
]

[tool.uv]
# Projet « application », pas une bibliothèque à builder : on exécute
# le code depuis les sources (uv run python -m training.entrainement).
package = false
# Utilise le magasin de certificats du système (interception TLS locale :
# antivirus / proxy). Évite d'avoir à passer --system-certs à chaque
# commande uv.
system-certs = true

# Index PyTorch CUDA 12.4 (roues GPU pour Windows / Python 3.13).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[tool.ruff]
line-length = 100
target-version = "py313"
